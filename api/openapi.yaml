        - winner_side
        - winner_team_ref
        - scored
        - duration_seconds
        - provisional
        - source
      type: object
    MatchEndedEvent:
      additionalProperties: false
      description: "The match ended. Provisional: what the lobby reported."
      properties:
        data:
          $ref: "#/components/schemas/MatchEndedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - match.ended
          examples:
            - match.ended
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    MatchStartedData:
      additionalProperties: false
      properties:
        dire_team_ref:
          description: The Dire team's reference
          type:
            - string
            - "null"
        host_seat_strategy:
          description: The host seat strategy of the launch
          type: string
        match_id:
          description: The match ID (64-bit, as a string)
          type: string
        radiant_team_ref:
          description: The Radiant team's reference
          type:
            - string
            - "null"
      required:
        - match_id
        - host_seat_strategy
        - radiant_team_ref
        - dire_team_ref
      type: object
    MatchStartedEvent:
      additionalProperties: false
      description: The match started.
      properties:
        data:
          $ref: "#/components/schemas/MatchStartedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - match.started
          examples:
            - match.started
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    MatchView:
      additionalProperties: false
      properties:
        duration_seconds:
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        match_id:
          description: 64-bit, as a string
          type:
            - string
            - "null"
        outcome:
          description: The raw EMatchOutcome
          format: int32
          type:
            - integer
            - "null"
        outcome_name:
          type:
            - string
            - "null"
        scored:
          type:
            - boolean
            - "null"
        started_at:
          format: date-time
          type:
            - string
            - "null"
        winner_side:
          type:
            - string
            - "null"
        winner_team_ref:
          type:
            - string
            - "null"
      required:
        - match_id
        - outcome
        - outcome_name
        - winner_side
        - winner_team_ref
        - scored
        - duration_seconds
        - started_at
        - ended_at
      type: object
    MemberView:
      additionalProperties: false
      properties:
        account_id:
          format: int32
          minimum: 0
          type: integer
        seat:
          type: string
      required:
        - account_id
        - seat
      type: object
    PlayerReq:
      additionalProperties: false
      properties:
        account_id:
          description: The 32-bit account ID; give this or steam_id
          examples:
            - 11111111
          format: int32
          minimum: 0
          type: integer
        captain:
          type: boolean
        steam_id:
          description: An individual account's SteamID64 as a string; give this or account_id
          examples:
            - "76561197971376839"
          type: string
      type: object
    PlayerView:
      additionalProperties: false
      properties:
        account_id:
          format: int32
          minimum: 0
          type: integer
        captain:
          type: boolean
        invite_confirmed:
          type: boolean
        invites_sent:
          format: int64
          type: integer
        last_invite_at:
          format: date-time
          type:
            - string
            - "null"
        ready:
          description: Typed !ready in the lobby chat and has not left their side since
          type: boolean
        seat:
          description: Where the player sits now, or null when not in the lobby
          type:
            - string
            - "null"
        status:
          description: pending, invited, joined, seated or left
          type: string
        steam_id:
          description: SteamID64 as a string
          type: string
      required:
        - account_id
        - steam_id
        - captain
        - status
        - seat
        - ready
        - invites_sent
        - last_invite_at
        - invite_confirmed
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: "Stable machine-readable error code: invalid_request, unauthorized, not_found, method_not_allowed, conflict, invalid_state, not_ready, host_not_seated, gone, payload_too_large, unsupported_media_type, league_not_held, unknown_game_mode, unknown_region, invite_limited, internal, unavailable or gc_timeout"
          examples:
            - not_found
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        retryable:
          description: True when the same request may succeed later (503 and 504)
          type: boolean
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
        - retryable
      type: object
    RefreshResultView:
      additionalProperties: false
      properties:
        bot:
          type: string
        error:
          description: Why the refresh failed; null unless status is failed
          type:
            - string
            - "null"
        leagues:
          description: The leagues the bot holds after the refresh
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        status:
          description: "ok: the list was fetched, or was fetched successfully moments ago and kept; failed: the list was not fetched (the request failed, or time ran out before the bot was asked) and the previous list stays; not_ready: the bot was not gc_ready and was not asked"
          enum:
            - ok
            - failed
            - not_ready
          type: string
      required:
        - bot
        - status
        - error
        - leagues
      type: object
    RefreshResults:
      additionalProperties: false
      properties:
        results:
          description: Every enabled bot, in config order
          items:
            $ref: "#/components/schemas/RefreshResultView"
          type:
            - array
            - "null"
      required:
        - results
      type: object
    RetryAccepted:
      additionalProperties: false
      properties:
        status:
          description: Always retry_requested
          enum:
            - retry_requested
          type: string
      required:
        - status
      type: object
    RosterRequest:
      additionalProperties: false
      properties:
        teams:
          $ref: "#/components/schemas/TeamsReq"
      required:
        - teams
      type: object
    SimChatResult:
      additionalProperties: false
      properties:
        delivered:
          description: True when the host was in the lobby chat and got the line
          type: boolean
        lobby:
          $ref: "#/components/schemas/SimLobbyView"
      required:
        - delivered
        - lobby
      type: object
    SimChatView:
      additionalProperties: false
      properties:
        account_id:
          format: int32
          minimum: 0
          type: integer
        at:
          format: date-time
          type: string
        delivered:
          description: False for a player's line said before the host joined the lobby chat; the host never saw it
          type: boolean
        persona_name:
          type: string
        text:
          type: string
      required:
        - account_id
        - persona_name
        - text
        - at
        - delivered
      type: object
    SimEndRequest:
      additionalProperties: false
      properties:
        result:
          description: radiant or dire wins, or not_scored (not_scored_canceled)
          enum:
            - radiant
            - dire
            - not_scored
          type: string
      required:
        - result
      type: object
    SimFailRequest:
      additionalProperties: false
      properties:
        mode:
          description: "lost: the lobby disappears from the bot's cache; load_failed: a launched lobby goes back to the UI state without a game"
          enum:
            - lost
            - load_failed
          type: string
      required:
        - mode
      type: object
    SimJoinRequest:
      additionalProperties: false
      properties:
        account_id:
          description: The joining player's 32-bit account ID; an invite is not needed
          examples:
            - 11111111
          format: int32
          minimum: 1
          type: integer
        persona_name:
          description: The name the player shows in chat; default "Player <account_id>"
          maxLength: 64
          type: string
      required:
        - account_id
      type: object
    SimLobbyList:
      additionalProperties: false
      properties:
        lobbies:
          description: Every simulated lobby, oldest first
          items:
            $ref: "#/components/schemas/SimLobbyView"
          type:
            - array
            - "null"
      required:
        - lobbies
      type: object
    SimLobbyView:
      additionalProperties: false
      properties:
        bot:
          description: The bot hosting the lobby
          type: string
        chat:
          description: The lobby chat, oldest first, the last 200 lines
          items:
            $ref: "#/components/schemas/SimChatView"
          type:
            - array
            - "null"
        chat_joined:
          description: True while the host is in the lobby chat
          type: boolean
        created_at:
          format: date-time
          type: string
        game_mode:
          format: int32
          minimum: 0
          type: integer
        gc_lobby_id:
          description: The simulated GC lobby ID, as the service's lobby shows it
          type: string
        host_account_id:
          format: int32
          minimum: 0
          type: integer
        league_id:
          description: The league read back; 0 when the bot does not administer the league asked for
          format: int32
          minimum: 0
          type: integer
        league_node_id:
          format: int32
          minimum: 0
          type: integer
        match_id:
          description: The simulated match ID once the match started
          type:
            - string
            - "null"
        members:
          description: Every member, the host included, in join order
          items:
            $ref: "#/components/schemas/SimMemberView"
          type:
            - array
            - "null"
        name:
          type: string
        outcome:
          description: The EMatchOutcome once the match ended
          format: int32
          type:
            - integer
            - "null"
        password:
          type: string
        pending_invites:
          description: Invited account IDs that have not joined
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        server_region:
          format: int32
          minimum: 0
          type: integer
        state:
          description: "The GC lobby state: ui before the launch, server_assign after it, run once the match started, postgame once it ended"
          enum:
            - ui
            - server_setup
            - run
            - postgame
            - ready_up
            - not_ready
            - server_assign
          type: string
        tv_delay_seconds:
          format: int32
          minimum: 0
          type: integer
      required:
        - gc_lobby_id
        - bot
        - host_account_id
        - state
        - name
        - password
        - league_id
        - league_node_id
        - game_mode
        - server_region
        - tv_delay_seconds
        - match_id
        - outcome
        - members
        - pending_invites
        - chat_joined
        - chat
        - created_at
      type: object
    SimMemberView:
      additionalProperties: false
      properties:
        account_id:
          format: int32
          minimum: 0
          type: integer
        host:
          description: True for the bot that hosts the lobby
          type: boolean
        persona_name:
          type: string
        slot:
          description: The slot on radiant or dire (0-4); the channel for broadcaster; 0 otherwise
          format: int32
          minimum: 0
          type: integer
        steam_id:
          description: The SteamID64, as a string
          type: string
        team:
          enum:
            - radiant
            - dire
            - broadcaster
            - spectator
            - player_pool
            - no_team
          type: string
      required:
        - account_id
        - steam_id
        - team
        - slot
        - persona_name
        - host
      type: object
    SimSayRequest:
      additionalProperties: false
      properties:
        account_id:
          description: The member who says it
          examples:
            - 11111111
          format: int32
          minimum: 1
          type: integer
        text:
          examples:
            - "!ready"
          maxLength: 300
          minLength: 1
          type: string
      required:
        - account_id
        - text
      type: object
    SimSeatRequest:
      additionalProperties: false
      properties:
        slot:
          description: The radiant or dire slot, 0-4; default the first free one
          format: int32
          maximum: 4
          minimum: 0
          type: integer
        team:
          description: Where the player moves; player_pool is the unassigned pool
          enum:
            - radiant
            - dire
            - player_pool
            - spectator
            - broadcaster
          type: string
      required:
        - team
      type: object
    SimSettingsRequest:
      additionalProperties: false
      properties:
        auto_join:
          type: boolean
        auto_join_delay_ms:
          format: int64
          maximum: 3600000
          minimum: 0
          type: integer
        auto_ready:
          type: boolean
        auto_start:
          type: boolean
        auto_start_delay_ms:
          format: int64
          maximum: 3600000
          minimum: 0
          type: integer
      type: object
    SimSettingsView:
      additionalProperties: false
      properties:
        auto_join:
          description: Invited players join and take a slot on their rostered side
          type: boolean
        auto_join_delay_ms:
          description: How long after the invite a player joins
          format: int64
          type: integer
        auto_ready:
          description: Auto-joined players say the ready command once seated
          type: boolean
        auto_start:
          description: A launched lobby starts its match on its own
          type: boolean
        auto_start_delay_ms:
          description: How long after the launch the match starts
          format: int64
          type: integer
        ready_command:
          description: "What a ready player says: lobby.chat.prefix and ready"
          type: string
      required:
        - auto_join
        - auto_join_delay_ms
        - auto_ready
        - auto_start
        - auto_start_delay_ms
        - ready_command
      type: object
    SimStartRequest:
      additionalProperties: false
      properties:
        match_id:
          description: The match ID to report, as a string; default the next simulated one
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      type: object
    TeamReq:
      additionalProperties: false
      properties:
        name:
          type: string
        players:
          description: Up to 5 players; empty for an open lobby
          items:
            $ref: "#/components/schemas/PlayerReq"
          type:
            - array
            - "null"
        team_ref:
          description: Your reference for the team
          type: string
      type: object
    TeamView:
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
        players:
          items:
            $ref: "#/components/schemas/PlayerView"
          type:
            - array
            - "null"
        team_ref:
          type:
            - string
            - "null"
      required:
        - team_ref
        - name
        - players
      type: object
    TeamsReq:
      additionalProperties: false
      properties:
        dire:
          $ref: "#/components/schemas/TeamReq"
        radiant:
          $ref: "#/components/schemas/TeamReq"
      type: object
    TeamsView:
      additionalProperties: false
      properties:
        dire:
          $ref: "#/components/schemas/TeamView"
        radiant:
          $ref: "#/components/schemas/TeamView"
      required:
        - radiant
        - dire
      type: object
    UpdateLobbyRequest:
      additionalProperties: false
      properties:
        admins:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        allow_cheats:
          type: boolean
        allow_short_handed:
          type: boolean
        game_mode:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        kick_strangers:
          type: boolean
        launch:
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        password:
          description: Empty removes the password
          type: string
        ready_check:
          type: boolean
        region:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        tv_delay_seconds:
          format: int32
          minimum: 0
          type: integer
        visibility:
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: The API key (secrets.api_key).
      in: header
      name: X-API-Key
      type: apiKey
    bearer:
      description: The same API key as a bearer token.
      scheme: bearer
      type: http
info:
  description: Dota 2 lobby management through Steam bot accounts. Errors are RFC 9457 problem details (application/problem+json) with a stable `code`. The /v1 operations need the API key when the service has one configured; /livez, /readyz and /health are always open and not part of this document.
  title: dota_lobby
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/bots:
    get:
      description: Every bot and its state. Credentials never appear.
      operationId: list-bots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: List the bots
      tags:
        - Bots
  /v1/bots/{name}:
    get:
      operationId: get-bot
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: Get a bot
      tags:
        - Bots
  /v1/bots/{name}/leagues:
    get:
      description: The leagues the bot may host, where each came from and when it first appeared, the outcome of the bot's last league list refresh, and its recent league changes.
      operationId: get-bot-leagues
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLeagues"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: Get a bot's leagues
      tags:
        - Leagues
  /v1/bots/{name}/leagues/refresh:
    post:
      description: Fetches the bot's admin league list from the game coordinator now, through its GC worker and bounded by gc.request_timeout, and answers the updated leagues as GET /v1/bots/{name}/leagues does. Use it after an organisation admin added the bot to a league, instead of waiting for league.refresh_interval. A list fetched successfully less than 15 seconds ago is answered without asking the game coordinator again. 503 when the bot is not gc_ready or the request failed (the previous list stays), 504 when the game coordinator did not answer in time, 409 when league.sources does not include gc.
      operationId: refresh-bot-leagues
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLeagues"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: Refresh a bot's leagues now
      tags:
        - Leagues
  /v1/bots/{name}/retry:
    post:
      description: The way out of needs_attention, e.g. after `dota_lobby auth --bot <name> --force` stored a new token or a password was fixed; also cuts a backoff or cooldown short. A no-op for a bot that is not waiting. 503 when the bot's run loop is too backed up to take the request.
      operationId: retry-bot
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "202":
          content:
