webhooks:
  lobby-event:
    post:
      description: One event, POSTed to every configured webhook URL, in order per lobby, retried until the receiver answers 2xx. The body is the same envelope GET /v1/lobbies/{id}/events lists. Verify the signature over the raw body.
      operationId: lobby-event
      parameters:
        - description: The event ID; the same on every retry.
          in: header
          name: X-Dota-Lobby-Event-Id
          required: true
          schema:
            type: string
        - description: The event type, as in the body.
          in: header
          name: X-Dota-Lobby-Event-Type
          required: true
          schema:
            type: string
        - description: When this attempt was signed, in Unix seconds.
          in: header
          name: X-Dota-Lobby-Timestamp
          required: true
          schema:
            type: string
        - description: "\"v1=\" and the hex HMAC-SHA256 of \"<timestamp>.<body>\" under the webhook secret; several comma-separated during a secret rotation."
          in: header
          name: X-Dota-Lobby-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyEvent"
        required: true
      responses:
        2XX:
          description: Delivered.
        default:
          description: Retried with backoff (408, 425, 429, 5xx, no answer) or given up (3xx, other 4xx).
      summary: A lobby event
      tags:
        - Lobbies
