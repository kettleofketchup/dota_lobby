  /v1/lobbies:
    get:
      description: Newest first, without passwords.
      operationId: list-lobbies
      parameters:
        - description: Only lobbies in these states, comma-separated; spaces around the commas are ignored
          explode: false
          in: query
          name: state
          schema:
            description: Only lobbies in these states, comma-separated; spaces around the commas are ignored
            items:
              enum:
                - pending
                - creating
                - waiting
                - ready
                - launching
                - in_game
                - post_game
                - finished
                - failed
                - closing
                - closed
                - timed_out
              type: string
            type:
              - array
              - "null"
        - description: Only lobbies with this external_ref, ended ones included
          explode: false
          in: query
          name: external_ref
          schema:
            description: Only lobbies with this external_ref, ended ones included
            type: string
        - description: Only lobbies that have not ended
          explode: false
          in: query
          name: active
          schema:
            description: Only lobbies that have not ended
            type: boolean
        - description: Page size, default 50
          explode: false
          in: query
          name: limit
          schema:
            description: Page size, default 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page
            type: string
      responses:
        "200":
          content:
            application/json:
