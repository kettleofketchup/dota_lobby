          type: integer
        captain:
          type: boolean
        invite_confirmed:
          type: boolean
        invites_sent:
          format: int64
          type: integer
        last_invite_at:
          format: date-time
          type:
            - string
            - "null"
        ready:
          description: Typed !ready in the lobby chat and has not left their side since
          type: boolean
        seat:
          description: Where the player sits now, or null when not in the lobby
          type:
            - string
            - "null"
        status:
          description: pending, invited, joined, seated or left
          type: string
        steam_id:
          description: SteamID64 as a string
          type: string
      required:
        - account_id
        - steam_id
        - captain
        - status
        - seat
        - ready
        - invites_sent
        - last_invite_at
        - invite_confirmed
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: "Stable machine-readable error code: invalid_request, unauthorized, not_found, method_not_allowed, conflict, invalid_state, not_ready, host_not_seated, gone, payload_too_large, unsupported_media_type, league_not_held, unknown_game_mode, unknown_region, invite_limited, internal, unavailable or gc_timeout"
          examples:
            - not_found
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        retryable:
          description: True when the same request may succeed later (503 and 504)
          type: boolean
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
        - retryable
      type: object
    RetryAccepted:
      additionalProperties: false
      properties:
        status:
          description: Always retry_requested
          enum:
            - retry_requested
          type: string
      required:
        - status
      type: object
    RosterRequest:
      additionalProperties: false
      properties:
        teams:
          $ref: "#/components/schemas/TeamsReq"
      required:
        - teams
      type: object
    TeamReq:
      additionalProperties: false
      properties:
        name:
          type: string
        players:
          description: Up to 5 players; empty for an open lobby
          items:
            $ref: "#/components/schemas/PlayerReq"
          type:
            - array
            - "null"
        team_ref:
          description: Your reference for the team
          type: string
      type: object
    TeamView:
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
        players:
          items:
            $ref: "#/components/schemas/PlayerView"
          type:
            - array
            - "null"
        team_ref:
          type:
            - string
            - "null"
      required:
        - team_ref
        - name
        - players
      type: object
    TeamsReq:
      additionalProperties: false
      properties:
        dire:
          $ref: "#/components/schemas/TeamReq"
        radiant:
          $ref: "#/components/schemas/TeamReq"
      type: object
    TeamsView:
      additionalProperties: false
      properties:
        dire:
          $ref: "#/components/schemas/TeamView"
        radiant:
          $ref: "#/components/schemas/TeamView"
      required:
        - radiant
        - dire
      type: object
    UpdateLobbyRequest:
      additionalProperties: false
      properties:
        admins:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        allow_cheats:
          type: boolean
        allow_short_handed:
          type: boolean
        game_mode:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        kick_strangers:
          type: boolean
        launch:
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        password:
          description: Empty removes the password
          type: string
        ready_check:
          type: boolean
        region:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        tv_delay_seconds:
          format: int32
          minimum: 0
          type: integer
        visibility:
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: The API key (secrets.api_key).
      in: header
      name: X-API-Key
      type: apiKey
    bearer:
      description: The same API key as a bearer token.
      scheme: bearer
      type: http
info:
  description: Dota 2 lobby management through Steam bot accounts. Errors are RFC 9457 problem details (application/problem+json) with a stable `code`. The /v1 operations need the API key when the service has one configured; /livez, /readyz and /health are always open and not part of this document.
  title: dota_lobby
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/bots:
    get:
      description: Every bot and its state. Credentials never appear.
      operationId: list-bots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: List the bots
      tags:
        - Bots
  /v1/bots/{name}:
    get:
      operationId: get-bot
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: Get a bot
      tags:
        - Bots
  /v1/bots/{name}/retry:
    post:
      description: The way out of needs_attention, e.g. after `dota_lobby auth --bot <name> --force` stored a new token or a password was fixed; also cuts a backoff or cooldown short. A no-op for a bot that is not waiting. 503 when the bot's run loop is too backed up to take the request.
      operationId: retry-bot
      parameters:
        - description: The bot's name from the config, matched case-insensitively
          in: path
          name: name
          required: true
          schema:
            description: The bot's name from the config, matched case-insensitively
            examples:
              - league_bot_1
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryAccepted"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - apiKey: []
        - bearer: []
      summary: Make a waiting bot try again now
      tags:
        - Bots
  /v1/leagues:
    get:
      description: Every league a bot may host, and which bots hold it.
      operationId: list-leagues
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
        - bearer: []
      summary: List the leagues
      tags:
        - Leagues
  /v1/leagues/{id}/nodes:
    get:
      description: Asks a ready bot that holds the league for its nodes, bounded by gc.request_timeout.
      operationId: list-league-nodes
      parameters:
        - description: The league ID
          in: path
          name: id
          required: true
          schema:
            description: The league ID
            examples:
              - 17929
            format: int32
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueNodes"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: List a league's lobby nodes
      tags:
        - Leagues
  /v1/lobbies:
    get:
      description: Newest first, without passwords.
      operationId: list-lobbies
      parameters:
        - description: Only lobbies in these states, comma-separated; spaces around the commas are ignored
          explode: false
          in: query
          name: state
          schema:
            description: Only lobbies in these states, comma-separated; spaces around the commas are ignored
            items:
              enum:
                - pending
                - creating
                - waiting
                - ready
                - launching
                - in_game
                - post_game
                - finished
                - failed
                - closing
                - closed
                - timed_out
              type: string
            type:
              - array
              - "null"
        - description: Only lobbies with this external_ref, ended ones included
          explode: false
          in: query
          name: external_ref
          schema:
            description: Only lobbies with this external_ref, ended ones included
            type: string
        - description: Only lobbies that have not ended
          explode: false
          in: query
          name: active
          schema:
            description: Only lobbies that have not ended
            type: boolean
        - description: Page size, default 50
          explode: false
          in: query
          name: limit
          schema:
            description: Page size, default 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - apiKey: []
        - bearer: []
      summary: List lobbies
      tags:
        - Lobbies
    post:
      description: Accepts the request (202) and creates the lobby in the background; follow it with get-lobby. Sending the same request again while the lobby is active returns it with 200. The response carries the password.
      operationId: create-lobby
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLobbyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyWithPassword"
          description: An active lobby with this external_ref and the same request exists; it is returned.
          headers:
            Location:
              schema:
                description: The lobby's URL
                type: string
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyWithPassword"
          description: Accepted
          headers:
            Location:
              schema:
                description: The lobby's URL
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unsupported Media Type
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - apiKey: []
        - bearer: []
      summary: Ask for a lobby
      tags:
        - Lobbies
  /v1/lobbies/{id}:
    delete:
      description: 202 when the lobby closes or starts closing; 200 when it was already closing or ended.
      operationId: close-lobby
      parameters:
        - description: The lobby ID
          in: path
          name: id
          required: true
          schema:
            description: The lobby ID
            examples:
              - lob_01JC9Z7Q8W5X2M3N4P5R6S7T8V
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyView"
          description: The lobby was already closing or ended; nothing changed.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyView"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: Close a lobby that has not launched
      tags:
        - Lobbies
    get:
      description: The lobby with its password.
      operationId: get-lobby
      parameters:
        - description: The lobby ID
          in: path
          name: id
          required: true
          schema:
            description: The lobby ID
            examples:
              - lob_01JC9Z7Q8W5X2M3N4P5R6S7T8V
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyWithPassword"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: Get a lobby
      tags:
        - Lobbies
    patch:
      description: Allowed in pending, waiting and ready.
      operationId: update-lobby
      parameters:
        - description: The lobby ID
          in: path
          name: id
          required: true
          schema:
            description: The lobby ID
            examples:
              - lob_01JC9Z7Q8W5X2M3N4P5R6S7T8V
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLobbyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyView"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unsupported Media Type
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: Change a lobby's settings
      tags:
        - Lobbies
  /v1/lobbies/{id}/events:
    get:
      description: Events with a seq above after, oldest first, in the envelope webhooks deliver.
      operationId: list-lobby-events
      parameters:
        - description: The lobby ID
          in: path
          name: id
          required: true
          schema:
            description: The lobby ID
            examples:
              - lob_01JC9Z7Q8W5X2M3N4P5R6S7T8V
            type: string
        - description: Only events with a higher seq
          explode: false
          in: query
          name: after
          schema:
            description: Only events with a higher seq
            format: int64
            minimum: 0
            type: integer
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gateway Timeout
      security:
        - apiKey: []
        - bearer: []
      summary: List a lobby's events
      tags:
        - Lobbies
  /v1/lobbies/{id}/invite:
    post:
      description: Only rostered players, in waiting and ready. 429 when every requested invite is rate-limited.
      operationId: invite-lobby-players
      parameters:
        - description: The lobby ID
          in: path
          name: id
          required: true
          schema:
            description: The lobby ID
            examples:
              - lob_01JC9Z7Q8W5X2M3N4P5R6S7T8V
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
