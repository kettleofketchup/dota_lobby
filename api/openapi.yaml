components:
  schemas:
    BotLeagueView:
      additionalProperties: false
      properties:
        first_seen_at:
          description: When the league first appeared in the bot's GC list; null for the config source
          format: date-time
          type:
            - string
            - "null"
        league_id:
          format: int32
          minimum: 0
          type: integer
        name:
          description: The league's name from the game coordinator, or null when unknown
          type:
            - string
            - "null"
        refreshed_at:
          description: When the bot's GC list was last fetched; null for the config source
          format: date-time
          type:
            - string
            - "null"
        source:
          description: "gc: the game coordinator's admin league list; config: the bot's configured leagues, unverified"
          enum:
            - gc
            - config
          type: string
        stale:
          description: True when the GC list comes from the database and has not been fetched since the service started
          type: boolean
        verified:
          description: True when the game coordinator's list names the league
          type: boolean
      required:
        - league_id
        - name
        - source
        - verified
        - first_seen_at
        - refreshed_at
        - stale
      type: object
    BotLeagues:
      additionalProperties: false
      properties:
        bot:
          type: string
        changes:
          description: The most recent league changes, newest first
          items:
            $ref: "#/components/schemas/LeagueChangeView"
          type:
            - array
            - "null"
        leagues:
          description: The leagues the bot may host, by league ID
          items:
            $ref: "#/components/schemas/BotLeagueView"
          type:
            - array
            - "null"
        refresh:
          $ref: "#/components/schemas/LeagueRefreshStatus"
          description: The outcome of the bot's last league list refresh
      required:
        - bot
        - leagues
        - refresh
        - changes
      type: object
    BotList:
      additionalProperties: false
      properties:
        bots:
          description: Every bot, in config order
          items:
            $ref: "#/components/schemas/BotView"
          type:
            - array
            - "null"
        simulation:
          description: True when the bots run against the simulated Steam and game coordinator (serve --simulate); nothing reaches Steam
          type: boolean
      required:
        - bots
        - simulation
      type: object
    BotView:
      additionalProperties: false
      properties:
        attempt:
          format: int64
          type: integer
        gc_queue_position:
          format: int32
          type:
            - integer
            - "null"
        last_error:
          type:
            - string
            - "null"
        last_error_message:
          type:
            - string
            - "null"
        leagues:
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        limited:
          type: boolean
        lobby:
          type:
            - string
            - "null"
        lobby_stale:
          type: boolean
        name:
          type: string
        ready:
          type: boolean
        ready_since:
          format: date-time
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        renew_blocked:
          type:
            - string
            - "null"
        since:
          format: date-time
          type: string
        state:
          type: string
        steam_id:
          type:
            - string
            - "null"
        token_expires_at:
          format: date-time
          type:
            - string
            - "null"
        username:
          type: string
      required:
        - name
        - username
        - state
        - ready
        - reason
        - last_error
        - last_error_message
        - since
        - steam_id
        - limited
        - lobby_stale
        - token_expires_at
        - renew_blocked
        - attempt
        - gc_queue_position
        - ready_since
        - leagues
        - lobby
      type: object
    CreateLobbyRequest:
      additionalProperties: false
      properties:
        admins:
          description: Account IDs allowed admin commands in this lobby's chat
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        allow_cheats:
          type: boolean
        allow_short_handed:
          type: boolean
        external_ref:
          description: Your key for the lobby, 1-128 letters, digits, '.', '_', ':' or '-'; unique among lobbies that have not ended
          examples:
            - game-42
          type: string
        game_mode:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        kick_strangers:
          type: boolean
        launch:
          description: manual (default) or auto
          type: string
        league_id:
          description: A league one of the bots administers; 0 for none
          format: int32
          minimum: 0
          type: integer
        league_node_id:
          format: int32
          minimum: 0
          type: integer
        metadata:
          additionalProperties:
            type: string
          description: Up to 16 string pairs, returned in every response
          type: object
        name:
          description: The lobby name, 1-64 characters
          examples:
            - Spring Cup R2 Ravens vs Owls
          type: string
        password:
          description: Up to 32 characters; empty means none
          type: string
        ready_check:
          type: boolean
        region:
          description: A name configured in lobby.game_modes or lobby.regions, or the wire number.
          oneOf:
            - type: string
            - maximum: 4294967295
              minimum: 0
              type: integer
        teams:
          $ref: "#/components/schemas/TeamsReq"
        tv_delay_seconds:
          description: 10, 60, 120, 300 or 900
          format: int32
          minimum: 0
          type: integer
        visibility:
          description: public (default), friends or unlisted
          type: string
      required:
        - external_ref
        - name
        - teams
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    EventList:
      additionalProperties: false
      properties:
        events:
          description: Oldest first
          items:
            $ref: "#/components/schemas/LobbyEvent"
          type:
            - array
            - "null"
        next_after:
          description: The last seq returned, or after when there is nothing new
          format: int64
          type: integer
      required:
        - events
        - next_after
      type: object
    HostSeatView:
      additionalProperties: false
      properties:
        confirmed:
          description: False when every strategy failed; launches then answer 409 host_not_seated
          type: boolean
        strategy:
          description: The host seat strategy that worked, or null
          type:
            - string
            - "null"
        team:
          description: Where the bot sits, or null
          type:
            - string
            - "null"
      required:
        - strategy
        - confirmed
        - team
      type: object
    InviteRequest:
      additionalProperties: false
      properties:
        missing:
          description: Invite every rostered player not in the lobby
          type: boolean
        players:
          description: Rostered players to invite again; give this or missing
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
      type: object
    InviteResult:
      additionalProperties: false
      properties:
        invited:
          items:
            format: int32
            minimum: 0
            type: integer
          type:
            - array
            - "null"
        skipped:
          items:
            $ref: "#/components/schemas/InviteSkip"
          type:
            - array
            - "null"
      required:
        - invited
        - skipped
      type: object
    InviteSkip:
      additionalProperties: false
      properties:
        account_id:
          format: int32
          minimum: 0
          type: integer
        reason:
          description: in_lobby, pending_cooldown, cap or not_rostered
          type: string
      required:
        - account_id
        - reason
      type: object
    KickRequest:
      additionalProperties: false
      properties:
        account_id:
          examples:
            - 99999999
          format: int32
          minimum: 1
          type: integer
        from:
          description: "team (default): back to the unassigned pool; lobby: out of the lobby"
          enum:
            - team
            - lobby
          type: string
      required:
        - account_id
      type: object
    LaunchRequest:
      additionalProperties: false
      properties:
        force:
          description: Launch from waiting, past the roster check and the attempt limit; never past the host seat check
          type: boolean
      type: object
    LeagueBotView:
      additionalProperties: false
      properties:
        name:
          type: string
        refreshed_at:
          format: date-time
          type:
            - string
            - "null"
        source:
          type: string
        stale:
          type: boolean
        verified:
          type: boolean
      required:
        - name
        - source
        - verified
        - refreshed_at
        - stale
      type: object
    LeagueChangeView:
      additionalProperties: false
      properties:
        at:
          description: The refresh that saw the change
          format: date-time
          type: string
        change:
          description: "added: the league appeared in the bot's GC list; removed: it disappeared"
          enum:
            - added
            - removed
          type: string
        league_id:
          format: int32
          minimum: 0
          type: integer
      required:
        - league_id
        - change
        - at
      type: object
    LeagueHolderView:
      additionalProperties: false
      properties:
        bot:
          description: The bot's name from the config
          type: string
        bot_state:
          description: The bot's connection state, as in GET /v1/bots
          type: string
        first_seen_at:
          description: When the league first appeared in the bot's GC list; null for the config source
          format: date-time
          type:
            - string
            - "null"
        lobby_id:
          description: The lobby the bot is hosting, or null when it is not leased
          type:
            - string
            - "null"
        ready:
          description: True when the bot is gc_ready
          type: boolean
        refreshed_at:
          description: When the bot's GC list was last fetched; null for the config source
          format: date-time
          type:
            - string
            - "null"
        source:
          description: "gc: the game coordinator's admin league list; config: the bot's configured leagues, unverified"
          enum:
            - gc
            - config
          type: string
        verified:
          description: True when the game coordinator's list names the league
          type: boolean
      required:
        - bot
        - source
        - verified
        - first_seen_at
        - refreshed_at
        - bot_state
        - ready
        - lobby_id
      type: object
    LeagueList:
      additionalProperties: false
      properties:
        leagues:
          description: Every league a bot may host
          items:
            $ref: "#/components/schemas/LeagueView"
          type:
            - array
            - "null"
      required:
        - leagues
      type: object
    LeagueNodeView:
      additionalProperties: false
      properties:
        group_name:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        node_id:
          format: int32
          minimum: 0
          type: integer
        team_id_1:
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        team_id_2:
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - node_id
        - name
        - group_name
        - team_id_1
        - team_id_2
      type: object
    LeagueNodes:
      additionalProperties: false
      properties:
        bot:
          description: The bot that asked the game coordinator
          type: string
        league_id:
          format: int32
          minimum: 0
          type: integer
        nodes:
          items:
            $ref: "#/components/schemas/LeagueNodeView"
          type:
            - array
            - "null"
      required:
        - league_id
        - bot
        - nodes
      type: object
    LeagueRefreshStatus:
      additionalProperties: false
      properties:
        error:
          description: Why the last fetch failed, or null when none failed since ok_at
          type:
            - string
            - "null"
        error_at:
          description: When that fetch failed
          format: date-time
          type:
            - string
            - "null"
        ok_at:
          description: The last successful fetch of the bot's GC league list, or null if none
          format: date-time
          type:
            - string
            - "null"
      required:
        - ok_at
        - error
        - error_at
      type: object
    LeagueView:
      additionalProperties: false
      properties:
        bots:
          description: The holders in the original shape; prefer holders
          items:
            $ref: "#/components/schemas/LeagueBotView"
          type:
            - array
            - "null"
        holders:
          description: Every enabled bot that may host the league, in config order
          items:
            $ref: "#/components/schemas/LeagueHolderView"
          type:
            - array
            - "null"
        holders_free:
          description: "How many holders could take a new lobby now: gc_ready, lobby cache current and not hosting a lobby"
          format: int64
          type: integer
        holders_total:
          description: How many bots hold the league
          format: int64
          type: integer
        league_id:
          format: int32
          minimum: 0
          type: integer
        name:
          type:
            - string
            - "null"
      required:
        - league_id
        - name
        - bots
        - holders
        - holders_total
        - holders_free
      type: object
    LobbyCreateFailedData:
      additionalProperties: false
      properties:
        code:
          description: Why the create failed; lobby.failed follows
          enum:
            - league_rejected
            - create_timeout
            - gc_error
          type: string
        message:
          description: The cause, for people
          type: string
      required:
        - code
        - message
      type: object
    LobbyCreateFailedEvent:
      additionalProperties: false
      description: The lobby could not be created.
      properties:
        data:
          $ref: "#/components/schemas/LobbyCreateFailedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.create_failed
          examples:
            - lobby.create_failed
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyCreatedData:
      additionalProperties: false
      properties:
        gc_lobby_id:
          description: The game coordinator's lobby ID (64-bit, as a string)
          type: string
        league_verified:
          description: Whether the game coordinator confirmed the league
          type: boolean
      required:
        - gc_lobby_id
        - league_verified
      type: object
    LobbyCreatedEvent:
      additionalProperties: false
      description: The game coordinator created the lobby.
      properties:
        data:
          $ref: "#/components/schemas/LobbyCreatedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.created
          examples:
            - lobby.created
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyEndedData:
      additionalProperties: false
      properties:
        reason:
          description: Why the lobby ended, as in lobby.state_changed
          type:
            - string
            - "null"
      required:
        - reason
      type: object
    LobbyEndedEvent:
      additionalProperties: false
      description: The lobby ended.
      properties:
        data:
          $ref: "#/components/schemas/LobbyEndedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.finished
            - lobby.closed
            - lobby.failed
            - lobby.timed_out
          examples:
            - lobby.finished
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyEnforcementStoppedData:
      additionalProperties: false
      properties:
        account_id:
          description: The member the bot stopped moving
          format: int32
          minimum: 0
          type: integer
        kicks:
          description: How often the bot moved the member
          format: int64
          type: integer
      required:
        - account_id
        - kicks
      type: object
    LobbyEnforcementStoppedEvent:
      additionalProperties: false
      description: The bot stopped moving a member.
      properties:
        data:
          $ref: "#/components/schemas/LobbyEnforcementStoppedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.enforcement_stopped
          examples:
            - lobby.enforcement_stopped
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyEvent:
      description: One lobby event. `type` names the event and decides the shape of `data`.
      discriminator:
        mapping:
          lobby.closed: "#/components/schemas/LobbyEndedEvent"
          lobby.create_failed: "#/components/schemas/LobbyCreateFailedEvent"
          lobby.created: "#/components/schemas/LobbyCreatedEvent"
          lobby.enforcement_stopped: "#/components/schemas/LobbyEnforcementStoppedEvent"
          lobby.failed: "#/components/schemas/LobbyEndedEvent"
          lobby.finished: "#/components/schemas/LobbyEndedEvent"
          lobby.launch_failed: "#/components/schemas/LobbyLaunchFailedEvent"
          lobby.launching: "#/components/schemas/LobbyLaunchingEvent"
          lobby.player_invited: "#/components/schemas/LobbyPlayerInvitedEvent"
          lobby.player_joined: "#/components/schemas/LobbyPlayerPresenceEvent"
          lobby.player_kicked: "#/components/schemas/LobbyPlayerKickedEvent"
          lobby.player_left: "#/components/schemas/LobbyPlayerPresenceEvent"
          lobby.player_ready: "#/components/schemas/LobbyPlayerReadyEvent"
          lobby.player_seated: "#/components/schemas/LobbyPlayerSeatedEvent"
          lobby.player_unready: "#/components/schemas/LobbyPlayerUnreadyEvent"
          lobby.ready: "#/components/schemas/LobbyReadyEvent"
          lobby.roster_changed: "#/components/schemas/LobbyTeamsEvent"
          lobby.state_changed: "#/components/schemas/LobbyStateChangedEvent"
          lobby.teams_flipped: "#/components/schemas/LobbyTeamsEvent"
          lobby.timed_out: "#/components/schemas/LobbyEndedEvent"
          lobby.unready: "#/components/schemas/LobbyUnreadyEvent"
          lobby.updated: "#/components/schemas/LobbyUpdatedEvent"
          match.ended: "#/components/schemas/MatchEndedEvent"
          match.started: "#/components/schemas/MatchStartedEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/LobbyStateChangedEvent"
        - $ref: "#/components/schemas/LobbyCreatedEvent"
        - $ref: "#/components/schemas/LobbyCreateFailedEvent"
        - $ref: "#/components/schemas/LobbyUpdatedEvent"
        - $ref: "#/components/schemas/LobbyTeamsEvent"
        - $ref: "#/components/schemas/LobbyPlayerInvitedEvent"
        - $ref: "#/components/schemas/LobbyPlayerPresenceEvent"
        - $ref: "#/components/schemas/LobbyPlayerSeatedEvent"
        - $ref: "#/components/schemas/LobbyPlayerKickedEvent"
        - $ref: "#/components/schemas/LobbyEnforcementStoppedEvent"
        - $ref: "#/components/schemas/LobbyPlayerReadyEvent"
        - $ref: "#/components/schemas/LobbyPlayerUnreadyEvent"
        - $ref: "#/components/schemas/LobbyReadyEvent"
        - $ref: "#/components/schemas/LobbyUnreadyEvent"
        - $ref: "#/components/schemas/LobbyLaunchingEvent"
        - $ref: "#/components/schemas/LobbyLaunchFailedEvent"
        - $ref: "#/components/schemas/MatchStartedEvent"
        - $ref: "#/components/schemas/MatchEndedEvent"
        - $ref: "#/components/schemas/LobbyEndedEvent"
    LobbyLaunchFailedData:
      additionalProperties: false
      properties:
        attempt:
          description: The launch attempt that failed
          format: int64
          type: integer
        next_strategy:
          description: The host seat strategy the next launch tries; null when none is left
          type:
            - string
            - "null"
        reason:
          description: Why, e.g. host_not_seated, server_stall, load_failed, ignored
          type: string
      required:
        - reason
        - attempt
        - next_strategy
      type: object
    LobbyLaunchFailedEvent:
      additionalProperties: false
      description: A launch did not reach a game.
      properties:
        data:
          $ref: "#/components/schemas/LobbyLaunchFailedData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.launch_failed
          examples:
            - lobby.launch_failed
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyLaunchingData:
      additionalProperties: false
      properties:
        attempt:
          description: The launch attempt, from 1
          format: int64
          type: integer
        by_account_id:
          description: Who started it in chat; null otherwise
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        host_seat_strategy:
          description: How the bot left the teams for this launch (lobby.host_seat_strategy)
          type: string
        trigger:
          description: What started the launch
          enum:
            - api
            - chat
            - auto
          type: string
      required:
        - trigger
        - by_account_id
        - attempt
        - host_seat_strategy
      type: object
    LobbyLaunchingEvent:
      additionalProperties: false
      description: A launch started.
      properties:
        data:
          $ref: "#/components/schemas/LobbyLaunchingData"
        id:
          description: Unique per event; the same on every delivery attempt
          examples:
            - evt_01JC9ZB2J4K6M8N0P2Q4R6S8T0
          type: string
        lobby:
          $ref: "#/components/schemas/LobbySummary"
          description: The lobby right after the change
        occurred_at:
          description: When the change happened (UTC)
          format: date-time
          type: string
        seq:
          description: "The event's number within its lobby: starts at 1, grows by one, no gaps"
          format: int64
          type: integer
        type:
          description: The event type; it decides the shape of data
          enum:
            - lobby.launching
          examples:
            - lobby.launching
          type: string
      required:
        - id
        - type
        - seq
        - occurred_at
        - lobby
        - data
      type: object
    LobbyList:
      additionalProperties: false
      properties:
        lobbies:
