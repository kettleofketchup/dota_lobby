name: Release Go Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history and tags: the notes list the commits since the previous release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in step with mise.toml and the Dockerfile's builder stage.
          go-version: "1.27.1"

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.49.0

      - name: Build Go binary
        run: make build

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: just ci::release-notes "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: bin/dota_lobby
